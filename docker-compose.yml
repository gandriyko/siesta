# Databases for the db-exec integration tests: scripts/test-db.sh
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: siesta
      POSTGRES_PASSWORD: siesta
      POSTGRES_DB: siesta
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siesta -d siesta"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: siesta
      MARIADB_DATABASE: siesta
      MARIADB_USER: siesta
      MARIADB_PASSWORD: siesta
    ports:
      - "127.0.0.1:23306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: siesta
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:29200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:siesta localhost:9200/_cluster/health"]
      interval: 3s
      timeout: 3s
      retries: 60

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: siesta
      MONGO_INITDB_ROOT_PASSWORD: siesta
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "siesta", "-p", "siesta", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
