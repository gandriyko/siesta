# Databases for the db-exec integration tests: scripts/test-db.sh
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: siesta
      POSTGRES_PASSWORD: siesta
      POSTGRES_DB: siesta
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siesta -d siesta"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: siesta
      MARIADB_DATABASE: siesta
      MARIADB_USER: siesta
      MARIADB_PASSWORD: siesta
    ports:
      - "127.0.0.1:23306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
