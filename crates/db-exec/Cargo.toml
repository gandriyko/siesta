[package]
name = "db-exec"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
db-conn = { path = "../db-conn" }
sql-split = { path = "../sql-split" }
# Postgres values are decoded from server text, MySQL ones through chrono / json; no uuid or decimal crates needed.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "mysql", "runtime-tokio", "tls-rustls", "json", "chrono"] }
futures-util = { version = "0.3", default-features = false }
# History timestamps; the version sqlx already brings in.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: Elasticsearch documents keep their field order as columns.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Elasticsearch over HTTP, the same client as Respite's.
reqwest = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
