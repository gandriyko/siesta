[package]
name = "siesta-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
db-conn = { path = "../db-conn" }
db-exec = { path = "../db-exec" }
sql-split = { path = "../sql-split" }
siesta-settings = { path = "../settings" }
siesta-workspace = { path = "../workspace" }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net", "signal", "macros"] }
rpassword = "7"

[dev-dependencies]
tempfile = "3"
